<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sửa sản phẩm - Smart Cafe</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin-product.css}">

</head>

<body>

<div class="admin-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div th:replace="~{fragments/admin-sidebar :: sidebar(active='product')}"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="admin-header">

            <h1>Quản lý Sản phẩm</h1>

            <div class="admin-info">

                <span>Administrator</span>

            </div>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="admin-content">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>Sửa sản phẩm</h1>

                    <p class="page-description">
                        Cập nhật thông tin sản phẩm
                    </p>

                </div>

                <a th:href="@{/admin/product/page}"
                   class="btn btn-secondary">

                    ← Quay lại danh sách

                </a>

            </div>


            <!-- =================================================
                 FORM CARD
            ================================================== -->

            <div class="card form-card">


                <!-- GENERAL ERROR -->

                <div th:if="${error}"
                     class="form-error"
                     th:text="${error}">

                    Có lỗi xảy ra.

                </div>


                <!-- FORM -->

                <form th:action="@{/admin/product/edit/{id}(id=${product.productId})}"
                      th:object="${productRequest}"
                      method="post"
                      enctype="multipart/form-data"
                      class="product-form">


                    <!-- =================================================
                         PRODUCT NAME
                    ================================================== -->

                    <div class="form-group">

                        <label for="name">
                            Tên sản phẩm
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               placeholder="Nhập tên sản phẩm"
                               required>

                    </div>


                    <!-- =================================================
                         CATEGORY
                    ================================================== -->

                    <div class="form-group">

                        <label for="categoryId">
                            Danh mục
                        </label>

                        <select id="categoryId"
                                th:field="*{categoryId}"
                                required>

                            <option value="">
                                -- Chọn danh mục --
                            </option>

                            <option th:each="category : ${categoryList}"
                                    th:value="${category.categoryId}"
                                    th:text="${category.name}">
                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         SIZE
                    ================================================== -->

                    <div class="form-group">

                        <label for="sizeId">
                            Kích thước
                        </label>

                        <select id="sizeId"
                                th:field="*{sizeId}">

                            <option value="">
                                -- Không áp dụng --
                            </option>

                            <option th:each="size : ${sizeList}"
                                    th:value="${size.sizeId}"
                                    th:text="${size.name}">
                            </option>

                        </select>

                        <small id="sizeHint"
                               class="form-hint">
                            Vui lòng chọn kích thước.
                        </small>

                    </div>


                    <!-- =================================================
                         PRICE
                    ================================================== -->

                    <div class="form-group">

                        <label for="price">
                            Giá bán
                        </label>

                        <div class="price-input">

                            <input type="number"
                                   id="price"
                                   th:field="*{price}"
                                   min="0"
                                   step="1000"
                                   placeholder="Nhập giá bán"
                                   required>

                            <span>₫</span>

                        </div>

                    </div>


                    <!-- =================================================
                         IMAGE
                    ================================================== -->

                    <div class="form-group">

                        <label for="image">
                            Hình ảnh sản phẩm
                        </label>


                        <!-- CURRENT IMAGE -->

                        <div th:if="${product.image != null and !product.image.isBlank()}"
                             class="current-image-container">

                            <p class="form-hint">
                                Hình ảnh hiện tại
                            </p>

                            <img th:src="${product.image}"
                                 th:alt="${product.name}"
                                 class="current-product-image">

                        </div>


                        <!-- FILE INPUT -->

                        <input type="file"
                               id="image"
                               th:field="*{image}"
                               accept="image/*">


                        <small class="form-hint">

                            Để trống nếu muốn giữ nguyên hình ảnh hiện tại.
                            Chọn hình ảnh mới nếu muốn thay thế.

                        </small>


                        <!-- NEW IMAGE PREVIEW -->

                        <div id="imagePreviewContainer"
                             class="image-preview-container"
                             style="display: none;">

                            <p class="form-hint">
                                Xem trước hình ảnh mới
                            </p>

                            <img id="imagePreview"
                                 class="image-preview"
                                 alt="Xem trước hình ảnh mới">

                        </div>

                    </div>


                    <!-- =================================================
                         STATUS
                    ================================================== -->

                    <div class="form-group">

                        <label for="status">
                            Trạng thái
                        </label>

                        <select id="status"
                                th:field="*{status}"
                                required>

                            <option value="">
                                -- Chọn trạng thái --
                            </option>

                            <option th:each="status : ${statusList}"
                                    th:value="${status}"
                                    th:text="${status.description}">
                            </option>

                        </select>

                    </div>


                    <!-- =================================================
                         ACTIONS
                    ================================================== -->

                    <div class="form-actions">

                        <a th:href="@{/admin/product/page}"
                           class="btn btn-secondary">

                            Hủy

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Lưu thay đổi

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     SUCCESS / ERROR TOAST
====================================================== -->

<div class="toast-container">

    <div th:if="${success}"
         class="toast toast-success">

        <div class="toast-title">
            Thành công
        </div>

        <div class="toast-message"
             th:text="${success}">
        </div>

    </div>


    <div th:if="${error}"
         class="toast toast-error">

        <div class="toast-title">
            Thất bại
        </div>

        <div class="toast-message"
             th:text="${error}">
        </div>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

    // ================================
    // IMAGE PREVIEW
    // ================================

    const imageInput =
        document.getElementById("image");

    const imagePreviewContainer =
        document.getElementById("imagePreviewContainer");

    const imagePreview =
        document.getElementById("imagePreview");


    imageInput.addEventListener("change", function () {

        const file = this.files[0];

        if (!file) {

            imagePreviewContainer.style.display = "none";

            imagePreview.src = "";

            return;
        }


        const reader =
            new FileReader();


        reader.onload = function (event) {

            imagePreview.src =
                event.target.result;

            imagePreviewContainer.style.display =
                "block";

        };


        reader.readAsDataURL(file);

    });


    // ================================
    // AUTO HIDE TOAST
    // ================================

    setTimeout(function () {

        const toasts =
            document.querySelectorAll(".toast");

        toasts.forEach(function (toast) {

            toast.classList.add("hide");

        });

    }, 3000);

    // ================================
    // SIZE - ENABLE / DISABLE THEO CATEGORY
    // ================================

    const categorySelect =
        document.getElementById("categoryId");

    const sizeSelect =
        document.getElementById("sizeId");

    const sizeHint =
        document.getElementById("sizeHint");


    function updateSizeField() {

        const selectedOption =
            categorySelect.options[
                categorySelect.selectedIndex
                ];

        if (!selectedOption) {
            return;
        }

        const categoryName =
            selectedOption.text
                .trim()
                .toLowerCase();


        // ================================
        // CAFE / CAKE
        // ================================

        if (
            categoryName === "cafe" ||
            categoryName === "cake"
        ) {

            // Không cho chọn kích thước
            sizeSelect.disabled = true;

            // Không bắt buộc
            sizeSelect.required = false;

            // Xóa giá trị size
            sizeSelect.value = "";

            sizeHint.textContent =
                "Danh mục Cafe/Cake không sử dụng kích thước.";

        }

            // ================================
            // CATEGORY KHÁC
        // ================================

        else {

            // Cho phép chọn
            sizeSelect.disabled = false;

            // Bắt buộc chọn
            sizeSelect.required = true;

            sizeHint.textContent =
                "Vui lòng chọn kích thước.";
        }
    }


    // ================================
    // KHI THAY ĐỔI DANH MỤC
    // ================================

    categorySelect.addEventListener(
        "change",
        updateSizeField
    );


    // ================================
    // KHI MỞ TRANG EDIT
    // ================================

    updateSizeField();

</script>

</body>

</html>
