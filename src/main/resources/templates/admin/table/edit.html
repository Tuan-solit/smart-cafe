<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sửa bàn - Smart Cafe</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin-staff.css}">

</head>

<body>

<div class="admin-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div th:replace="~{fragments/admin-sidebar :: sidebar(active='table')}"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="admin-header">

            <h1>Quản lý Bàn</h1>

            <div class="admin-info">

                <span>Administrator</span>

            </div>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="admin-content">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>Sửa bàn</h1>

                    <p class="page-description">
                        Cập nhật thông tin bàn
                    </p>

                </div>

                <a th:href="@{/admin/table/page}"
                   class="btn btn-secondary">

                    ← Quay lại danh sách

                </a>

            </div>


            <!-- =================================================
                 FORM CARD
            ================================================== -->

            <!-- ERROR MESSAGE -->

            <div th:if="${error}"
                 class="error-message">

                <span th:text="${error}"></span>

            </div>


            <div class="card form-card">

                <form th:action="@{/admin/table/edit/{id}(id=${table.tableId})}"
                      th:object="${tableRequest}"
                      method="post">

            <div class="card form-card">

                <form th:action="@{/admin/table/edit/{id}(id=${table.tableId})}"
                      th:object="${tableRequest}"
                      method="post">


                    <!-- SỐ BÀN -->

                    <div class="form-group">

                        <label for="tableNumber">
                            Số bàn
                        </label>

                        <input id="tableNumber"
                               type="text"
                               th:field="*{tableNumber}"
                               placeholder="VD: A1, A2, B1..."
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('tableNumber')}"
                             th:errors="*{tableNumber}">
                        </div>

                    </div>


                    <!-- =================================================
                         QR CODE
                    ================================================== -->

                    <div class="staff-info">

                        <div class="info-label">
                            Mã QR của bàn
                        </div>


                        <div th:if="${table.urlQr != null and !table.urlQr.isBlank()}">

                            <img th:src="${table.urlQr}"
                                 alt="Mã QR của bàn"
                                 style="
                                    display: block;
                                    width: 200px;
                                    height: 200px;
                                    object-fit: contain;
                                    border: 1px solid #ddd;
                                    padding: 10px;
                                    border-radius: 8px;
                                    background: #fff;
                                 ">

                        </div>


                        <div th:if="${table.urlQr == null or table.urlQr.isBlank()}"
                             class="form-hint">

                            Bàn này chưa có mã QR.

                        </div>

                    </div>


                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <a th:href="@{/admin/table/page}"
                           class="btn btn-secondary">

                            Hủy

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Lưu thay đổi

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     SUCCESS MODAL
====================================================== -->

<div th:if="${success}"
     id="successModal"
     class="success-modal-overlay"
     style="display: flex;">

    <div class="success-modal">

        <div class="success-modal-icon">
            ✓
        </div>

        <h2>
            Cập nhật bàn thành công!
        </h2>

        <p>
            Thông tin bàn đã được cập nhật.
        </p>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

    document.addEventListener('DOMContentLoaded', function () {

        const successModal =
            document.getElementById('successModal');


        if (successModal) {

            setTimeout(function () {

                window.location.href =
                    '/admin/table/page';

            }, 2000);

        }

    });

</script>


<!-- =====================================================
     SUCCESS MODAL CSS
====================================================== -->

<style>

    .success-modal-overlay {

        display: flex;

        position: fixed;

        inset: 0;

        background: rgba(0, 0, 0, 0.5);

        align-items: center;

        justify-content: center;

        z-index: 9999;

        backdrop-filter: blur(2px);

    }


    .success-modal {

        width: 400px;

        max-width: calc(100% - 40px);

        background: #ffffff;

        border-radius: 18px;

        padding: 48px 32px;

        text-align: center;

        box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);

        animation:
                successModalShow 0.3s ease-out;

    }


    .success-modal-icon {

        width: 80px;

        height: 80px;

        margin: 0 auto 24px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        background: #d4edda;

        color: #28a745;

        font-size: 40px;

        font-weight: bold;

        border: 4px solid #c3e6cb;

    }


    .success-modal h2 {

        margin: 0 0 12px;

        font-size: 24px;

        color: #222;

    }


    .success-modal p {

        margin: 0;

        color: #666;

        font-size: 15px;

        line-height: 1.5;

    }


    @keyframes successModalShow {

        from {

            opacity: 0;

            transform: scale(0.9);

        }

        to {

            opacity: 1;

            transform: scale(1);

        }

    }


    .staff-info {

        background: #f8f9fa;

        padding: 15px;

        border-radius: 6px;

        margin: 20px 0;

    }


    .info-label {

        font-weight: 500;

        color: #666;

        margin-bottom: 12px;

    }

    .error-message {

        background: #fde2e2;

        color: #b42318;

        border: 1px solid #f5b5b5;

        padding: 12px 16px;

        border-radius: 6px;

        margin-bottom: 20px;

        font-size: 14px;

    }

</style>

</body>

</html>
