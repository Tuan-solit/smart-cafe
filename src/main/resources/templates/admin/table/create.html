<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thêm bàn - Smart Cafe</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin-staff.css}">

</head>

<body>

<div class="admin-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div th:replace="~{fragments/admin-sidebar :: sidebar(active='table')}"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="admin-header">

            <h1>Quản lý Bàn</h1>

            <div class="admin-info">

                <span>Administrator</span>

            </div>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="admin-content">


            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>Thêm bàn</h1>

                    <p class="page-description">
                        Thêm bàn mới vào hệ thống
                    </p>

                </div>

                <a th:href="@{/admin/table/page}"
                   class="btn btn-secondary">

                    ← Quay lại danh sách

                </a>

            </div>


            <!-- =================================================
                 FORM CARD
            ================================================== -->

            <div class="card form-card">

                <form th:action="@{/admin/table/create}"
                      th:object="${tableRequest}"
                      method="post">


                    <!-- SỐ BÀN -->

                    <div class="form-group">

                        <label for="tableNumber">
                            Số bàn
                        </label>

                        <input id="tableNumber"
                               type="text"
                               th:field="*{tableNumber}"
                               placeholder="VD: A1, A2, B1..."
                               required>

                        <div class="field-error"
                             th:if="${#fields.hasErrors('tableNumber')}"
                             th:errors="*{tableNumber}">
                        </div>

                    </div>


                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <a th:href="@{/admin/table/page}"
                           class="btn btn-secondary">

                            Hủy

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Thêm bàn

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>

</body>

</html>
