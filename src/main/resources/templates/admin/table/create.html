<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Bàn - Smart Cafe</title>
    <link rel="stylesheet"
          th:href="@{/css/admin-staff.css}">
</head>

<body>

<div class="page-container">

    <div class="page-header">
        <h1>Thêm Bàn</h1>
        <a th:href="@{/admin/table/page}"
           class="btn btn-secondary">
            Quay lại
        </a>
    </div>

    <div class="card form-card">

        <form th:action="@{/admin/table/create}"
              th:object="${tableRequest}"
              method="post">

            <div class="form-group">
                <label for="tableNumber">Số bàn</label>
                <input id="tableNumber"
                       type="text"
                       th:field="*{tableNumber}"
                       placeholder="VD: A1, A2, B1..."
                       required>
                <div class="field-error"
                     th:if="${#fields.hasErrors('tableNumber')}"
                     th:errors="*{tableNumber}">
                </div>
            </div>

            <div class="form-actions">
                <a th:href="@{/admin/table/page}"
                   class="btn btn-secondary">
                    Hủy
                </a>
                <button type="submit"
                        class="btn btn-primary">
                    Thêm Bàn
                </button>
            </div>

        </form>

    </div>

</div>
