<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Thêm danh mục - Smart Cafe</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

    <link rel="stylesheet"
          th:href="@{/css/admin-category.css}">

</head>

<body>

<div class="admin-layout">

    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <div th:replace="~{fragments/admin-sidebar :: sidebar(active='category')}"></div>


    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->

    <main class="admin-main">

        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="admin-header">

            <h1>Quản lý Danh mục</h1>

            <div class="admin-info">

                <span>Administrator</span>

            </div>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <section class="admin-content">

            <!-- PAGE HEADER -->

            <div class="page-header">

                <div>

                    <h1>Thêm danh mục</h1>

                    <p class="page-description">
                        Tạo danh mục sản phẩm mới
                    </p>

                </div>

                <a th:href="@{/admin/category/page}"
                   class="btn btn-secondary">

                    ← Quay lại danh sách

                </a>

            </div>


            <!-- =================================================
                 FORM CARD
            ================================================== -->

            <div class="card category-form-card">

                <form th:action="@{/admin/category/create}"
                      th:object="${categoryRequest}"
                      method="post"
                      class="category-form">


                    <!-- TÊN DANH MỤC -->

                    <div class="form-group">

                        <label for="name">
                            Tên danh mục
                        </label>

                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               placeholder="Nhập tên danh mục"
                               autocomplete="off"
                               autofocus
                               required>

                        <div th:if="${#fields.hasErrors('name')}"
                             class="field-error"
                             th:errors="*{name}">
                        </div>

                    </div>


                    <!-- GENERAL ERROR -->

                    <div th:if="${error}"
                         class="form-error"
                         th:text="${error}">

                        Có lỗi xảy ra.

                    </div>


                    <!-- ACTIONS -->

                    <div class="form-actions">

                        <a th:href="@{/admin/category/page}"
                           class="btn btn-secondary">

                            Hủy

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            Thêm danh mục

                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

</div>


<!-- =====================================================
     ERROR TOAST
====================================================== -->

<div th:if="${error}"
     class="toast-container">

    <div class="toast toast-error">

        <div class="toast-title">
            Thất bại
        </div>

        <div class="toast-message"
             th:text="${error}">
        </div>

    </div>

</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script>

    setTimeout(function () {

        const toasts =
            document.querySelectorAll('.toast');

        toasts.forEach(function (toast) {

            toast.classList.add('hide');

        });

    }, 3000);

</script>

</body>

</html>
