<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Staff</title>

    <link rel="stylesheet"
          th:href="@{/css/admin-staff.css}">
</head>

<body>

<div class="page-container">

    <!-- Header -->
    <div class="page-header">

        <div>
            <h1>Edit Staff</h1>
            <p class="page-description">
                Cập nhật thông tin nhân viên
            </p>
        </div>

        <a th:href="@{/admin/staff/page}"
           class="btn btn-secondary">
            ← Back to Staff List
        </a>

    </div>


    <!-- Edit Card -->
    <div class="form-card">

        <form th:action="@{/admin/staff/edit/{id}(id=${staff.userId})}"
              th:object="${staffRequest}"
              method="post">

            <!-- Full Name -->
            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input id="fullName"
                       type="text"
                       th:field="*{fullName}"
                       placeholder="Nhập họ và tên"
                       required>

                <div class="field-error"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">
                </div>

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input id="phone"
                       type="text"
                       th:field="*{phone}"
                       placeholder="Nhập số điện thoại"
                       required>

                <div class="field-error"
                     th:if="${#fields.hasErrors('phone')}"
                     th:errors="*{phone}">
                </div>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input id="email"
                       type="email"
                       th:field="*{email}"
                       placeholder="Nhập email"
                       required>

                <div class="field-error"
                     th:if="${#fields.hasErrors('email')}"
                     th:errors="*{email}">
                </div>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    New Password
                </label>

                <input id="password"
                       type="password"
                       th:field="*{password}"
                       placeholder="Để trống nếu không muốn đổi mật khẩu">

                <div class="form-hint">
                    Chỉ nhập nếu muốn thay đổi mật khẩu của nhân viên.
                </div>

                <div class="field-error"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}">
                </div>

            </div>


            <!-- Current Status -->
            <div class="staff-info">

                <div class="info-label">
                    Current Status
                </div>

                <span th:if="${staff.status.name() == 'ACTIVE'}"
                      class="status status-active">
                    ACTIVE
                </span>

                <span th:if="${staff.status.name() == 'INACTIVE'}"
                      class="status status-inactive">
                    INACTIVE
                </span>

            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <a th:href="@{/admin/staff/page}"
                   class="btn btn-secondary">
                    Cancel
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
