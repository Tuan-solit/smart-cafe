<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Cafe</title>

    <link rel="stylesheet"
          th:href="@{/css/admin.css}">

</head>

<body>

<div class="admin-layout">

    <!-- =========================
         SIDEBAR
         ========================= -->

    <div th:replace="~{fragments/admin-sidebar :: sidebar(active='dashboard')}"></div>


    <!-- =========================
         MAIN CONTENT
         ========================= -->

    <main class="admin-main">

        <!-- HEADER -->

        <header class="admin-header">

            <h1>Admin Dashboard</h1>

            <div class="admin-info">

                <span>Administrator</span>

            </div>

        </header>


        <!-- CONTENT -->

        <section class="admin-content">

            <h2>Tổng quan</h2>


            <!-- =========================
                 STATISTICS
                 ========================= -->

            <div class="stats">

                <!-- NHÂN VIÊN -->

                <div class="card">

                    <div class="card-title">
                        Nhân viên
                    </div>

                    <div class="card-value"
                         th:text="${employeeCount}">
                        0
                    </div>

                </div>


                <!-- BÀN -->

                <div class="card">

                    <div class="card-title">
                        Bàn
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>


                <!-- ĐƠN HÀNG -->

                <div class="card">

                    <div class="card-title">
                        Đơn hàng hôm nay
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>


                <!-- DOANH THU -->

                <div class="card">

                    <div class="card-title">
                        Doanh thu hôm nay
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>

            </div>


            <!-- =========================
                 QUICK ACTION
                 ========================= -->

            <div class="quick-actions">

                <h3>Thao tác nhanh</h3>

                <div class="actions">

                    <a th:href="@{/admin/staff/page}"
                       class="btn">
                        Quản lý nhân viên
                    </a>

                    <a th:href="@{/admin/category/page}"
                       class="btn">
                        Quản lý danh mục
                    </a>

                    <a th:href="@{/admin/product/page}"
                       class="btn">
                        Quản lý sản phẩm
                    </a>

                    <a th:href="@{/admin/table/page}"
                       class="btn">
                        Quản lý bàn
                    </a>

                </div>

            </div>

        </section>

    </main>

</div>

</body>

</html>
