<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - Smart Cafe</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #333;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* SIDEBAR */

        .sidebar {
            width: 240px;
            background: #222;
            color: white;
            padding: 20px 0;
        }

        .logo {
            padding: 0 24px 30px;
            font-size: 22px;
            font-weight: bold;
        }

        .menu {
            list-style: none;
        }

        .menu li a {
            display: block;
            padding: 14px 24px;
            color: #ddd;
            text-decoration: none;
        }

        .menu li a:hover,
        .menu li a.active {
            background: #333;
            color: white;
        }

        /* MAIN */

        .main {
            flex: 1;
        }

        .header {
            height: 70px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid #ddd;
        }

        .header h1 {
            font-size: 22px;
        }

        .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .content {
            padding: 30px;
        }

        .content h2 {
            margin-bottom: 25px;
        }

        /* STAT CARDS */

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .card-title {
            color: #777;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        /* QUICK ACTION */

        .quick-actions {
            background: white;
            border-radius: 10px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .quick-actions h3 {
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
            background: #222;
            color: white;
        }

        .btn:hover {
            opacity: 0.85;
        }

        @media (max-width: 1000px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 700px) {
            .sidebar {
                width: 180px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="layout">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">
            ☕ Smart Cafe
        </div>

        <ul class="menu">

            <li>
                <a href="/admin/dashboard"
                   class="active">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="/admin/staff">
                    Nhân viên
                </a>
            </li>

            <li>
                <a href="#">
                    Bàn
                </a>
            </li>

            <li>
                <a href="#">
                    Menu
                </a>
            </li>

            <li>
                <a href="#">
                    Đơn hàng
                </a>
            </li>

            <li>
                <a href="#">
                    Thanh toán
                </a>
            </li>

        </ul>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <!-- HEADER -->

        <header class="header">

            <h1>Admin Dashboard</h1>

            <div class="admin-info">
                <span>Administrator</span>

                <form th:action="@{/logout}"
                      method="post">

                    <button type="submit">
                        Đăng xuất
                    </button>

                </form>
            </div>

        </header>


        <!-- CONTENT -->

        <section class="content">

            <h2>Tổng quan</h2>


            <!-- STATISTICS -->

            <div class="stats">

                <div class="card">

                    <div class="card-title">
                        Nhân viên
                    </div>

                    <div class="card-value"
                         th:text="${employeeCount}">
                        0
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        Bàn
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        Đơn hàng hôm nay
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>


                <div class="card">

                    <div class="card-title">
                        Doanh thu hôm nay
                    </div>

                    <div class="card-value">
                        -
                    </div>

                </div>

            </div>


            <!-- QUICK ACTION -->

            <div class="quick-actions">

                <h3>Thao tác nhanh</h3>

                <div class="actions">

                    <a href="/admin/staff/page"
                       class="btn">
                        Quản lý nhân viên
                    </a>

                    <a href="#"
                       class="btn">
                        Quản lý bàn
                    </a>

                    <a href="#"
                       class="btn">
                        Quản lý menu
                    </a>

                </div>

            </div>

        </section>

    </main>

</div>

</body>

</html>
