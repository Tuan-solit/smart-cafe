<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đơn hàng</title>

    <link rel="stylesheet" href="/css/order.css">
</head>

<body>

<div class="order-container">
    <a th:href="@{/menu}" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #5C3A21; font-weight: 600; margin-bottom: 16px;">
        <span>←</span> Tiếp tục gọi món
    </a>

    <h1>ĐƠN HÀNG CỦA BẠN</h1>

    <div class="table-info">

        <span>🪑</span>

        <span>
            Bàn
            <span th:text="${order.table.tableNumber}">
            </span>
        </span>

    </div>

    <div class="order-header">
        <span>Sản phẩm</span>
        <span>SL</span>
        <span>Thành tiền</span>
    </div>

    <div class="order-item"
         th:each="detail : ${orderDetails}">
        <div class="product-info">
            <img th:src="${detail.product.image}"
                 alt="product">
            <span th:text="${detail.product.name}">
            </span>
        </div>

        <div class="quantity"
             th:text="${detail.quantity}">

        </div>

        <div class="item-total">
            <span
                    th:text="${#numbers.formatDecimal(
                    detail.price
                    * detail.quantity,
                    0,
                    'COMMA',
                    0,
                    'POINT'
                ) + 'đ'}">
               
            </span>
        </div>
    </div>

    <div class="order-total">
        <span>Tổng cộng</span>
        <strong
                th:text="${#numbers.formatDecimal(
                total,
                0,
                'COMMA',
                0,
                'POINT'
            ) + 'đ'}">

        </strong>

    </div>
    <button type="button"
            class="payment-btn"
            onclick="openPaymentModal()">
        Thanh toán
    </button>
</div>

<div id="paymentModal"
     class="payment-modal">
    <div class="payment-modal-content">
        <div class="payment-modal-header">
            <h2>Chọn phương thức thanh toán</h2>
            <button type="button"
                    class="modal-close"
                    onclick="closePaymentModal()">
                ×
            </button>
        </div>
<!--        <div class="payment-total">-->
<!--            <span>Tổng thanh toán</span>-->
<!--            <strong-->
<!--                    th:text="${#numbers.formatDecimal(-->
<!--                    total,-->
<!--                    0,-->
<!--                    'COMMA',-->
<!--                    0,-->
<!--                    'POINT'-->
<!--                ) + 'đ'}">-->
<!--                183.000đ-->
<!--            </strong>-->
<!--        </div>-->
        <div class="payment-options">
            <label class="payment-option">
                <input type="radio"
                       name="paymentMethod"
                       value="CASH">
                <div class="payment-option-content">
                    <div class="payment-icon">💵</div>
                    <div>
                        <strong>Tiền mặt</strong>
                        <span>Thanh toán trực tiếp tại quầy</span>
                    </div>
                </div>
            </label>
            <label class="payment-option">
                <input type="radio"
                       name="paymentMethod"
                       value="ONLINE">
                <div class="payment-option-content">
                    <div class="payment-icon">🏦</div>
                    <div>
                        <strong>Chuyển khoản</strong>
                        <span>Thanh toán qua QR với PayOS</span>
                    </div>
                </div>
            </label>
        </div>
        <input type="hidden" id="currentOrderId" th:value="${order != null ? order.orderId : ''}">
        <button type="button"
                class="confirm-payment-btn"
                onclick="confirmPayment()">
            Xác nhận thanh toán
        </button>
    </div>

</div>

<script>
    function openPaymentModal() {
        document.getElementById("paymentModal").classList.add("active");
    }
    
    function closePaymentModal() {
        document.getElementById("paymentModal").classList.remove("active");
    }

    function confirmPayment() {
        const selected =
            document.querySelector('input[name="paymentMethod"]:checked');
        if (!selected) {
            alert("Vui lòng chọn phương thức thanh toán.");
            return;
        }
        if (selected.value === "CASH") {
            payByCash();
        } else if (selected.value === "ONLINE") {
            payByOnline();
        }
    }

    function payByCash() {
        const orderIdInput = document.getElementById("currentOrderId");
        const orderId = orderIdInput ? orderIdInput.value : null;

        if (!orderId) {
            alert("Không tìm thấy thông tin đơn hàng!");
            return;
        }
        const form = document.createElement("form");
        form.method = "POST";
        form.action = "/payment/cash/request";

        const inputOrderId = document.createElement("input");
        inputOrderId.type = "hidden";
        inputOrderId.name = "orderId"; 
        inputOrderId.value = orderId;
        form.appendChild(inputOrderId)
        document.body.appendChild(form);
        form.submit();
    }
    
    function payByOnline() {
        const orderId = document.getElementById("currentOrderId")?.value;
        if (!orderId) {
            alert("Không tìm thấy thông tin đơn hàng!");
            return;
        }
        window.location.href = "/payment/" + orderId + "/online";
    }
</script>
</body>
</html>
