<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Đơn hàng</title>

    <link rel="stylesheet" href="/css/order.css">
</head>

<body>

<div class="order-container">

    <h1>ĐƠN HÀNG CỦA BẠN</h1>

    <div class="table-info">

        <span>🪑</span>

        <span>
            Bàn
            <span th:text="${order.table.tableNumber}">
            </span>
        </span>

    </div>
    
    <div class="order-header">
        <span>Sản phẩm</span>
        <span>SL</span>
        <span>Thành tiền</span>
    </div>
    
    <div class="order-item"
         th:each="detail : ${orderDetails}">
        <div class="product-info">
            <img th:src="${detail.product.image}"
                 alt="product">
            <span th:text="${detail.product.name}">
            </span>
        </div>
        
        <div class="quantity"
             th:text="${detail.quantity}">
            
        </div>

        <div class="item-total">
            <span
                    th:text="${#numbers.formatDecimal(
                    detail.price
                    * detail.quantity,
                    0,
                    'COMMA',
                    0,
                    'POINT'
                ) + 'đ'}">
               
            </span>
        </div>
    </div>

    <div class="order-total">
        <span>Tổng cộng</span>
        <strong
                th:text="${#numbers.formatDecimal(
                total,
                0,
                'COMMA',
                0,
                'POINT'
            ) + 'đ'}">
            
        </strong>

    </div>
    <a th:href="@{/payment}"
       class="payment-btn">
        Thanh toán
    </a>
</div>
</body>
</html>
