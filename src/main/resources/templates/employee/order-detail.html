<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/employee.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='orders')}"></div>

<div class="main-content">
  <a th:href="@{/employee/orders}" class="text-decoration-none text-muted mb-3 d-inline-block">
    <i class="fa-solid fa-arrow-left me-1"></i>Quay lại
  </a>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div th:if="${orderDetail}">
    <h4>Đơn #<span th:text="${orderDetail.orderId}"></span> — Bàn <span th:text="${orderDetail.tableNumber}"></span></h4>

    <div class="panel mt-3">
      <table class="table mb-0 align-middle">
        <thead>
        <tr class="text-muted" style="font-size: 0.8rem; text-transform: uppercase;">
          <th>Món</th><th>SL</th><th>Đơn giá</th><th>Ghi chú</th><th class="text-end">Thành tiền</th>
          <th th:if="${orderDetail.status == 'OPEN'}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(orderDetail.items)}">
          <td colspan="6" class="text-center text-muted py-4">Chưa có món nào trong đơn</td>
        </tr>
        <tr th:each="item : ${orderDetail.items}">
          <td th:text="${item.productName}"></td>
          <td th:text="${item.quantity}"></td>
          <td th:text="${item.price + ' đ'}"></td>
          <td th:text="${item.note}"></td>
          <td class="text-end" th:text="${item.price * item.quantity + ' đ'}"></td>
          <td th:if="${orderDetail.status == 'OPEN'}">
            <button type="button" class="btn btn-sm btn-outline-danger"
                    data-bs-toggle="modal" data-bs-target="#removeItemModal"
                    th:data-order-id="${orderDetail.orderId}"
                    th:data-product-id="${item.productId}"
                    th:data-product-name="${item.productName}">
              <i class="fa-solid fa-trash"></i>
            </button>
          </td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
          <td colspan="4" class="text-end fw-semibold">Tổng cộng</td>
          <td class="text-end fw-bold" th:text="${orderDetail.total + ' đ'}"></td>
          <td th:if="${orderDetail.status == 'OPEN'}"></td>
        </tr>
        </tfoot>
      </table>
    </div>

    <!-- Form thêm món -->
    <div class="panel p-3 mt-3" th:if="${orderDetail.status == 'OPEN'}">
      <h6 class="mb-3">Thêm món vào đơn</h6>
      <form th:action="@{/employee/orders/{id}/items(id=${orderDetail.orderId})}" method="post"
            class="row g-2 align-items-end">
        <div class="col-md-5">
          <label class="form-label">Sản phẩm</label>
          <select name="productId" class="form-select" required>
            <option value="" disabled selected>-- Chọn món --</option>
            <option th:each="p : ${products}" th:value="${p.productId}"
                    th:text="${p.name + ' - ' + p.price + ' đ'}"></option>
          </select>
        </div>
        <div class="col-md-2">
          <label class="form-label">Số lượng</label>
          <input type="number" name="quantity" class="form-control" value="1" min="1" required>
        </div>
        <div class="col-md-3">
          <label class="form-label">Ghi chú</label>
          <input type="text" name="note" class="form-control" placeholder="">
        </div>
        <div class="col-md-2">
          <button type="submit" class="btn btn-dark w-100">
            <i class="fa-solid fa-plus me-1"></i>Thêm
          </button>
        </div>
      </form>
    </div>

    <!-- Thanh toán -->
    <div class="mt-3" th:if="${orderDetail.status == 'OPEN'}">
      <button type="button" class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#confirmPaymentModal">
        <i class="fa-solid fa-money-bill-wave me-1"></i>Xác nhận thanh toán tiền mặt
      </button>
    </div>

    <!-- Modal xác nhận thanh toán -->
    <div class="modal fade" id="confirmPaymentModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">
              <i class="fa-solid fa-circle-check text-success me-2"></i>Xác nhận thanh toán
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <p class="mb-1">Xác nhận đã thu <strong th:text="${orderDetail.total + ' đ'}"></strong> tiền mặt cho đơn
              #<span th:text="${orderDetail.orderId}"></span> — Bàn <span th:text="${orderDetail.tableNumber}"></span>?</p>
            <p class="text-muted mb-0" style="font-size: 0.85rem;">Sau khi xác nhận, đơn hàng sẽ chuyển sang trạng thái đã thanh toán và không thể chỉnh sửa.</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Hủy</button>
            <form th:action="@{/employee/orders/{id}/confirm-cash(id=${orderDetail.orderId})}" method="post">
              <button type="submit" class="btn btn-dark">
                <i class="fa-solid fa-check me-1"></i>Xác nhận
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
