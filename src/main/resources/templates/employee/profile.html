<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Tài khoản</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/employee.css}">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='profile')}"></div>

<div class="main-content" style="max-width: 560px;">
  <h4 class="mb-4">Thông tin tài khoản</h4>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="panel p-4 mb-4">
    <form th:action="@{/employee/profile}" th:object="${updateProfileRequest}" method="post">
      <div class="mb-3">
        <label class="form-label">Họ tên</label>
        <input type="text" class="form-control" th:field="*{fullName}">
      </div>
      <div class="mb-3">
        <label class="form-label">Số điện thoại</label>
        <input type="text" class="form-control" th:field="*{phone}">
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" th:field="*{email}">
      </div>
      <button type="submit" class="btn btn-dark">
        <i class="fa-solid fa-floppy-disk me-1"></i>Lưu thay đổi
      </button>
    </form>
  </div>

  <div class="panel p-4">
    <h6 class="mb-3">Đổi mật khẩu</h6>
    <form th:action="@{/employee/profile/change-password}" method="post">
      <div class="mb-3">
        <label class="form-label">Mật khẩu hiện tại</label>
        <input type="password" name="oldPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu mới</label>
        <input type="password" name="newPassword" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Xác nhận mật khẩu mới</label>
        <input type="password" name="confirmPassword" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-outline-dark">
        <i class="fa-solid fa-key me-1"></i>Đổi mật khẩu
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
