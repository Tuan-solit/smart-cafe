<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Bảng điều khiển nhân viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buihuutam05062002/cafe-asset@main/employee.css" >
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='dashboard')}"></div>

<div class="main-content">
    <div class="topbar">
        <div>
            <h4 class="mb-0">Chào, <span sec:authentication="principal.fullName">Nhân viên</span></h4>
            <p class="text-muted mb-0" style="font-size: 0.9rem;">Đây là tình hình ca làm việc hôm nay của bạn.</p>
        </div>
        <a th:href="@{/employee/tables}" class="btn btn-dark">
            <i class="fa-solid fa-plus me-1"></i> Mở bàn mới
        </a>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-label">Đơn hôm nay</div>
                <div class="stat-value" th:text="${dashboard.todayOrderCount ?: 0}">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-label">Đang chờ xử lý</div>
                <div class="stat-value" th:text="${dashboard.pendingOrderCount ?: 0}">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-label">Đã hoàn tất</div>
                <div class="stat-value" th:text="${dashboard.completedOrderCount ?: 0}">0</div>
            </div>
        </div>
        <div class="col-6 col-md-3">
            <div class="stat-card">
                <div class="stat-label">Doanh thu ca này</div>
                <div class="stat-value" th:text="${(dashboard.shiftRevenue ?: 0) + ' đ'}">0 đ</div>
            </div>
        </div>
    </div>

    <div class="row g-3">
        <div class="col-lg-8">
            <div class="panel">
                <div class="panel-header d-flex justify-content-between align-items-center">
                    <span>Đơn hàng gần đây</span>
                    <a th:href="@{/employee/orders}" class="text-decoration-none" style="font-size: 0.85rem;">Xem tất cả
                        →</a>
                </div>
                <div class="table-responsive">
                    <table class="table mb-0 align-middle">
                        <thead>
                        <tr class="text-muted" style="font-size: 0.8rem; text-transform: uppercase;">
                            <th>Mã đơn</th>
                            <th>Bàn</th>
                            <th>Trạng thái</th>
                            <th class="text-end">Tổng tiền</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(dashboard.recentOrders)}">
                            <td colspan="4" class="text-center text-muted py-4">Chưa có đơn hàng nào hôm nay</td>
                        </tr>
                        <tr th:each="order : ${dashboard.recentOrders}">
                            <td>#<span th:text="${order.orderId}"></span></td>
                            <td th:text="${order.tableNumber}"></td>
                            <td>
                                <span class="status-badge"
                                      th:classappend="${order.status == 'OPEN'} ? 'status-pending' : 'status-done'"
                                      th:text="${order.status}"></span>
                            </td>
                            <td class="text-end" th:text="${order.total + ' đ'}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="panel p-3">
                <div class="fw-semibold mb-3">Thao tác nhanh</div>
                <div class="row g-2">
                    <div class="col-6">
                        <a th:href="@{/employee/tables}" class="quick-action">
                            <i class="fa-solid fa-mug-hot d-block mb-2"></i>
                            <span style="font-size: 0.85rem;">Mở bàn</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a th:href="@{/employee/orders}" class="quick-action">
                            <i class="fa-solid fa-money-bill-wave d-block mb-2"></i>
                            <span style="font-size: 0.85rem;">Thanh toán</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a th:href="@{/employee/activity-logs}" class="quick-action">
                            <i class="fa-solid fa-clock-rotate-left d-block mb-2"></i>
                            <span style="font-size: 0.85rem;">Lịch sử</span>
                        </a>
                    </div>
                    <div class="col-6">
                        <a th:href="@{/employee/profile}" class="quick-action">
                            <i class="fa-solid fa-user-gear d-block mb-2"></i>
                            <span style="font-size: 0.85rem;">Tài khoản</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
