<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đơn hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buihuutam05062002/cafe-asset@main/employee.css" >
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='orders')}"></div>

<div class="main-content">
  <h4 class="mb-4">Đơn hàng đang mở</h4>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

  <div class="panel">
    <table class="table mb-0 align-middle">
      <thead>
      <tr class="text-muted" style="font-size: 0.8rem; text-transform: uppercase;">
        <th>Mã đơn</th><th>Bàn</th><th>Giờ mở</th><th>Trạng thái</th><th></th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${orderPage.empty}">
        <td colspan="5" class="text-center text-muted py-4">Không có đơn nào đang mở</td>
      </tr>
      <tr th:each="order : ${orderPage.content}">
        <td>#<span th:text="${order.orderId}"></span></td>
        <td th:text="${order.table.tableNumber}"></td>
        <td th:text="${#temporals.format(order.createdAt, 'HH:mm dd/MM')}"></td>
        <td><span class="status-badge status-pending" th:text="${order.status}"></span></td>
        <td>
          <a th:href="@{/employee/orders/{id}(id=${order.orderId})}" class="btn btn-sm btn-outline-dark">
            <i class="fa-solid fa-eye me-1"></i>Xem
          </a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${orderPage.totalPages > 1}" class="mt-3">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, orderPage.totalPages - 1)}"
          th:classappend="${i == currentPage} ? 'active'">
        <a class="page-link" th:href="@{/employee/orders(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
