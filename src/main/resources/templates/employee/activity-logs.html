<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Lịch sử thao tác</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buihuutam05062002/cafe-asset@main/employee.css" >
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='logs')}"></div>

<div class="main-content">
  <h4 class="mb-4">Lịch sử thao tác của tôi</h4>

  <div class="panel">
    <table class="table mb-0 align-middle">
      <thead>
      <tr class="text-muted" style="font-size: 0.8rem; text-transform: uppercase;">
        <th>Thời gian</th><th>Hành động</th>
      </tr>
      </thead>
      <tbody>
      <tr th:if="${logs.empty}">
        <td colspan="2" class="text-center text-muted py-4">Chưa có thao tác nào</td>
      </tr>
      <tr th:each="log : ${logs.content}">
        <td th:text="${#temporals.format(log.createdAt, 'HH:mm dd/MM/yyyy')}"></td>
        <td th:text="${log.action}"></td>
      </tr>
      </tbody>
    </table>
  </div>

  <nav th:if="${logs.totalPages > 1}" class="mt-3">
    <ul class="pagination">
      <li class="page-item" th:each="i : ${#numbers.sequence(0, logs.totalPages - 1)}"
          th:classappend="${i == currentPage} ? 'active'">
        <a class="page-link" th:href="@{/employee/activity-logs(page=${i})}" th:text="${i + 1}"></a>
      </li>
    </ul>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
