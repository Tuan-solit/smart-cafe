<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Thanh toán chuyển khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/buihuutam05062002/cafe-asset@main/employee.css">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(active='orders')}"></div>

<div class="main-content">
    <a th:href="@{/employee/orders/{id}(id=${orderId})}" class="text-decoration-none text-muted mb-3 d-inline-block">
        <i class="fa-solid fa-arrow-left me-1"></i>Quay lại
    </a>

    <div class="panel p-4 text-center" style="max-width: 400px; margin: 0 auto;">
        <h5>Thanh toán đơn #<span th:text="${orderId}"></span></h5>
        <p class="text-muted mb-3">Số tiền: <strong th:text="${total} + ' đ'"></strong></p>

        <img th:src="${qrUrl}" alt="QR thanh toán" class="img-fluid mb-3" style="max-width: 280px;"/>

        <p class="text-muted mb-2">Còn lại: <span id="countdown" class="fw-bold">15:00</span></p>

        <div id="statusBox" class="alert alert-warning">
            <i class="fa-solid fa-spinner fa-spin me-1"></i>
            <span id="statusText">Đang chờ khách chuyển khoản...</span>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const paymentId = /*[[${paymentId}]]*/ 0;
    const orderId = /*[[${orderId}]]*/ 0;

    let remaining = 15 * 60;
    const countdownEl = document.getElementById('countdown');
    const countdownInterval = setInterval(() => {
        remaining--;
        const m = Math.floor(remaining / 60), s = remaining % 60;
        countdownEl.textContent = `${m}:${s.toString().padStart(2, '0')}`;
        if (remaining <= 0) clearInterval(countdownInterval);
    }, 1000);

    const statusInterval = setInterval(() => {
        fetch(`/employee/orders/payments/${paymentId}/status`)
            .then(res => res.json())
            .then(data => {
                const box = document.getElementById('statusBox');
                const text = document.getElementById('statusText');
                if (data.status === 'SUCCESS') {
                    clearInterval(statusInterval);
                    clearInterval(countdownInterval);
                    box.className = 'alert alert-success';
                    text.innerText = 'Thanh toán thành công!';
                    setTimeout(() => window.location.href = `/employee/orders/${orderId}`, 1500);
                } else if (data.status === 'FAILED') {
                    clearInterval(statusInterval);
                    clearInterval(countdownInterval);
                    box.className = 'alert alert-danger';
                    text.innerText = 'Hết thời gian thanh toán, vui lòng thử lại.';
                }
            });
    }, 3000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
