spring:
  application:
    name: Smart_Cafe

  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate   

    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
  thymeleaf:
    cache: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080


