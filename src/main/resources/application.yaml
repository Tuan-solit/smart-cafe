spring:
  application:
    name: Smart_Cafe

  datasource:
    url: jdbc:mysql://localhost:3306/smart_cafe?createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  web:
    resources:
      add-mappings: false

    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
#    baseline-on-migrate: true
#    baseline-version: 0

server:
  port: 8080



sepay:
