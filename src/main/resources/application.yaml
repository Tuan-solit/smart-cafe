spring:
  application:
    name: Smart_Cafe

  datasource:
    url: jdbc:mysql://localhost:3306/smart_cafe?createDatabaseIfNotExist=true
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 8080

sepay:
  bank-account: "0721074737777"
  bank-name: MBBank
  accountHolder: Bui Huu Tam
  api-key: ${SEPAY_API_KEY}


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

app:
  qr-code:
    base-url: ${QR_CODE_BASE_URL:http://localhost:8080}