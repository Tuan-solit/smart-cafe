<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

</head>
<body>
<div th:replace="~{layout/header :: siteHeader}"></div>

<div class="bg-light d-flex align-items-center justify-content-center">
    <div class="card shadow-lg w-100" style="max-width: 480px;">
        <div class="card-body">
            <div class="text-center">
                <h1 class="card-title h3">Sign Up</h1>
                <p class="card-text text-muted">Sign up below to access your account</p>
            </div>
            <div class="mt-4">
                <form id="registerForm">
                    <div class="mb-4">
                        <label for="fullName" class="form-label text-muted">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" placeholder="name required" required>
                    </div>
                    <div class="mb-4">
                        <label for="email" class="form-label text-muted">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Email Address" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required minlength="8">
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label text-muted"> Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Password" required>
                    </div>
                    <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-dark btn-lg">Sign up</button>
                    </div>
                    <p class="text-center text-muted mt-4">Already have an account?
                        <a th:href="@{/login}" class="text-decoration-none">Sign in</a>.
                    </p>
                </form>
            </div>
        </div>
    </div>
</div>


<div th:replace="~{layout/footer :: siteFooter}"></div>

</body>
</html>
